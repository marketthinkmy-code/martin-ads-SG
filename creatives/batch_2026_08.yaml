  copy:
    sg:
      headline: 不吃保健品，孩子反而长高了
      description: 免费线上课 · 不推产品，教你把孩子的体质调对
      intro: |-
        不喝牛奶、不吃保健品，孩子反而长高了 😲

        这位妈妈一开始也不信。
        直到第 3 个月，她发现女儿的裙子突然变短了。

        这是家长自己记的成长台账：
        📅 2024 年 8 月：六岁女儿 106cm、四岁儿子 98cm
        📅 2025 年 3 月：七岁女儿 112cm、五岁儿子 105cm
        → 半年多，女儿长了 6cm、儿子长了 7cm，平均一个月约 1cm

        她后来在推荐里写：
        「上课之前，孩子一直都是全班最矮，身型小一岁，
        试过长高汤但没看到显著的果效。
        上完三天的课，老师不推产品，甚至说不用买 supplement 给孩子，
        主打了解孩子体质、调理好他们的身体，
        自然就可以透过日常饮食、生活习惯让他们长高。」

        你是不是也试过：
        ❌ 牛奶喝了好几年，身高没什么动静
        ❌ 保健品买了一堆，效果像买个心安
        ❌ 每年体检看到成长曲线就皱眉

        问题往往不是「补得不够」，而是方向错了。
        不是补钙补钙再补钙，孩子就会长高。
      closing: 别让身高成为孩子一辈子的遗憾。
