  content_id: sg-好评合集-7个月12cm
  copy:
    sg:
      headline: 7 个月，哥哥长了 12cm
      description: 6000+ 家长的共同见证 · 免费线上课
      intro: |-
        「从 11 月上课到现在，哥哥总共长了 12cm。
        我发梦都不敢想。」

        这是一位妈妈 6 月在群里发的分享：
        👦 儿子 14 岁（还没过生日）—— 157cm
        👧 女儿 11 岁（刚过生日）—— 152.7cm

        对比三月份，哥哥长了 5cm、妹妹长了 4.7cm；
        从去年 11 月上课算起，哥哥一共长了 12cm、妹妹长了 8.7cm。

        她还补了一句，看得我很有感触：
        「哥哥从小都是班里矮小的，一年级到五年级排队都排前三 ——
        如果那是考试排名就好咯。」

        这样的分享，我每个月都会收到很多。

        有妈妈说：「裤子越来越短，我才发现她真的长高了。」
        她家两个孩子，从去年 8 月到今年 3 月，平均一个月长 1cm。

        也有妈妈说：「医生说不会再长了。」
        结果 18 岁的大女儿长了 3cm，现在比 151cm 的妈妈还高；
        4 岁的弟弟戒掉麦类奶制品后，几个月内长了 5cm。

        他们的孩子体质不同、年龄不同、起点也不同。
        但方向是同一个：先把体质调对，成长自然会跟上。
      closing: 孩子的成长期一生只有一次，错过就补不回来。
