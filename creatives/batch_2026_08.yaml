- id: growing_pain
  group: a_knowledge
  kind: carousel
  dir: a_knowledge/growing_pain
  content_id: sg-生长痛-晚上喊脚痛
  copy:
    sg:
      headline: 孩子晚上喊脚痛？可能是生长痛
      description: 免费线上课 · 教你判断、缓解，还有长高推拿手法
      intro: |-
        孩子一到晚上就喊脚痛，半夜还会痛醒，
        问他哪里痛，他又说不清楚 ——
        那很可能是「生长痛」。

        3～12 岁的孩子里，约有 25%～40% 都经历过。

        为什么会痛？
        因为发育不平衡：
        骨骼长得快，但四肢的神经、肌腱、肌肉跟不上，
        腿部肌肉被拉紧，就产生了酸痛。

        换句话说 —— 会痛，往往代表他正在长。

        怎么判断是不是生长痛？
        ✅ 早上起床时没感觉，傍晚或睡眠途中才痛
        ✅ 多发生在小腿、膝盖、大腿、脚踝
        ✅ 通常一小时内就缓解
        ✅ 第二天睡醒完全没影响

        ⚠️ 但如果孩子的痛不符合这几点 ——
        白天也痛、每次都痛在同一个固定位置、
        有红肿发热、走路一跛一跛，或者连续好几天不退，
        就不要当成生长痛处理，请尽快带他看医生。

        如果确认是生长痛，真正要做的不是止痛，
        而是帮孩子把跟不上的肌肉和筋膜松开，
        再把营养和睡眠补上，让骨骼和软组织同步成长。
      closing: |-
        孩子会痛，是身体在长的信号。
        别只是让他忍过去 —— 顺势把该补的补上。
      curriculum: |-
        ✅ 儿童长高推拿手法 —— 正好用来放松紧绷的腿部肌肉
        ✅ 长不高的四大体质偏差
        ✅ 长高关键营养素的正确摄取
        ✅ 打开肠胃黄金吸收力
        ✅ 比跳绳更有效的科学增高运动
        ✅ 成长金三角：把身高、注意力、睡眠一起管好
      cards:
      - {}
      - {}
      - name: 什么是生长痛
        description: 3–12 岁，25%–40% 都经历过
      - name: 为什么会痛
        description: 骨骼快，肌腱肌肉跟不上
      - name: 怎么判断
        description: 早上不痛 · 一小时内缓解
    cal:
      headline: 孩子晚上喊腳痛？可能是生長痛
      description: 免費線上課 · 教你判斷、緩解，還有長高推拿手法
      intro: |-
        孩子一到晚上就喊腳痛，半夜還會痛醒，
        問他哪裡痛，他又說不清楚 ——
        那很可能是「生長痛」。

        3～12 歲的孩子裡，約有 25%～40% 都經歷過。

        為什麼會痛？
        因為發育不平衡：
        骨骼長得快，但四肢的神經、肌腱、肌肉跟不上，
        腿部肌肉被拉緊，就產生了痠痛。

        換句話說 —— 會痛，往往代表他正在長。

        怎麼判斷是不是生長痛？
        ✅ 早上起床時沒感覺，傍晚或睡眠途中才痛
        ✅ 多發生在小腿、膝蓋、大腿、腳踝
        ✅ 通常一小時內就緩解
        ✅ 第二天睡醒完全沒影響

        ⚠️ 但如果孩子的痛不符合這幾點 ——
        白天也痛、每次都痛在同一個固定位置、
        有紅腫發熱、走路一跛一跛，或者連續好幾天不退，
        就不要當成生長痛處理，請儘快帶他看醫生。

        如果確認是生長痛，真正要做的不是止痛，
        而是幫孩子把跟不上的肌肉和筋膜鬆開，
        再把營養和睡眠補上，讓骨骼和軟組織同步成長。
      closing: |-
        孩子會痛，是身體在長的訊號。
        別隻是讓他忍過去 —— 順勢把該補的補上。
      curriculum: |-
        ✅ 兒童長高推拿手法 —— 正好用來放鬆緊繃的腿部肌肉
        ✅ 長不高的四大體質偏差
        ✅ 長高關鍵營養素的正確攝取
        ✅ 開啟腸胃黃金吸收力
        ✅ 比跳繩更有效的科學增高運動
        ✅ 成長金三角：把身高、注意力、睡眠一起管好
      cards:
