      - name: 怎麼判斷
        description: 早上不痛 · 一小時內緩解
- id: who_chart
  group: a_knowledge
  kind: single_image
  dir: a_knowledge/who_chart
  content_id: sg-WHO对照表-达标吗-静态图
  copy:
    sg:
      headline: 你的孩子身高，达标了吗？
      description: 对照 WHO 标准 · 一堂免费线上课，揭秘一年增高 6cm
      intro: |-
        妈妈请注意 ⚠️ 你的孩子身高，达标了吗？

        这是世界卫生组织（WHO）5–15 岁的平均身高对照表：

        👦 男孩：5岁 110.3 · 7岁 122.0 · 9岁 133.5 · 11岁 144.5 · 13岁 156.2 · 15岁 165.7cm
        👧 女孩：5岁 109.6 · 7岁 120.8 · 9岁 132.4 · 11岁 144.2 · 13岁 153.6 · 15岁 157.5cm

        现在就去量一量你的孩子，对照看看差了多少。

        如果他明显低于同龄标准，或者你还发现：
        · 明显比同班同学矮一颗头
        · 保健品吃了一堆，牛奶天天当水喝
        · 每天跳绳 500 下，最后还是没长高 😱

        先别急 —— 只要孩子还不到 15 岁，他就还有机会长高。
        不是孩子长不高，是方法用错了。

        而且我要提醒你：刚好「贴着平均线」也不代表安全。
        真正要看的是他每年长多少，以及成长空间还剩多少。
      closing: 长高不能等。3–15 岁的黄金期一生只有一次，错过就补不回来。
    cal:
      headline: 你的孩子身高，達標了嗎？
      description: 對照 WHO 標準 · 一堂免費線上課，揭秘一年增高 6cm
      intro: |-
        媽媽請注意 ⚠️ 你的孩子身高，達標了嗎？

        這是世界衛生組織（WHO）5–15 歲的平均身高對照表：

        👦 男孩：5歲 110.3 · 7歲 122.0 · 9歲 133.5 · 11歲 144.5 · 13歲 156.2 · 15歲 165.7cm
        👧 女孩：5歲 109.6 · 7歲 120.8 · 9歲 132.4 · 11歲 144.2 · 13歲 153.6 · 15歲 157.5cm

        現在就去量一量你的孩子，對照看看差了多少。

        如果他明顯低於同齡標準，或者你還發現：
        · 明顯比同班同學矮一顆頭
        · 保健品吃了一堆，牛奶天天當水喝
        · 每天跳繩 500 下，最後還是沒長高 😱

        先別急 —— 只要孩子還不到 15 歲，他就還有機會長高。
        不是孩子長不高，是方法用錯了。

        而且我要提醒你：剛好「貼著平均線」也不代表安全。
        真正要看的是他每年長多少，以及成長空間還剩多少。
      closing: 長高不能等。3–15 歲的黃金期一生只有一次，錯過就補不回來。
