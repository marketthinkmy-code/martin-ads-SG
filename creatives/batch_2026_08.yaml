  content_id: sg-睡眠-生长激素黄金时段
  copy:
    sg:
      headline: 晚上 9 点到凌晨 3 点，才是长高黄金时段
      description: 免费线上课 · 睡眠、饮食、体质，一次讲清楚
      intro: |-
        不是让孩子睡得多，就长得快 😴

        真正的关键，是他有没有睡在生长激素分泌的黄金时段。

        生长激素主要在孩子睡眠时分泌，
        尤其是晚上 9 点到凌晨 3 点这段时间。
        如果错过了这个时段，即使睡得再多，
        也达不到最佳的生长效果。

        也就是说 —— 11 点才上床的孩子，
        就算睡满 9 小时，也已经错过了大半个高峰期。

        顺便对照一下，你家孩子睡够了吗？
        · 1–3 岁：11–14 小时
        · 3–5 岁：10–13 小时
        · 5–12 岁：9–11 小时
        · 12–18 岁：8–10 小时

        而睡不够、睡太晚，影响的不只是身高：
        📉 身高 —— 错过生长激素高峰，身高增长受影响
        😵 精神 —— 白天精神不振，影响学习和日常活动
        📚 课业 —— 上课容易分心、打瞌睡，学习效果大打折扣

        很多家长以为孩子长不高是「吃得不够」，
        其实问题常常出在「睡得太晚」。
      closing: 孩子的长高黄金期一生只有一次，错过就补不回来。
