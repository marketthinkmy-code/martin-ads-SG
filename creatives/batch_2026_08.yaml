  content_id: sg-好评集锦-看过专科西医和营养师
  copy:
    sg:
      headline: 看过专科西医和营养师，她还是改了做法
      description: 免费线上课 · 别人有效的方法，未必适合你孩子的体质
      intro: |-
        「我看过儿童长高专科的西医，也见过营养师。
        听完马丁老师的解说，才有恍然大悟的感觉。」

        这是一位妈妈自己写下的话。
        她不是没做过功课 —— 她是做得比大多数家长都多的那种。

        让她转念的是这一点：
        「西医的方法，是把同样的模式和食谱用在几乎每一个孩子身上，
        没有把体质纳入考量。」

        这也是我一直想告诉家长的事：
        孩子长不高，往往不是因为你做得不够，
        而是因为别人家有效的方法，未必适合你家孩子的体质。

        另一位妈妈的记录更实在：
        她的女儿卡了 4 个月没长高，
        调整之后 7 个星期，终于长了 1cm。
        她做的是：忌麦奶、煲药膳、偶尔做筋膜运动、
        睡前听音乐，再帮孩子做手部推拿。

        不是什么惊天动地的大改造，只是把方向换对了。
      closing: 别让身高成为孩子一辈子的遗憾。
