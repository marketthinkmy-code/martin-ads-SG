- id: puberty_countdown
  group: b_myths
  kind: single_image
  dir: b_myths/puberty_countdown
  content_id: sg-青春期倒计时-初经变声不是开始
  copy:
    sg:
      headline: 初经、变声，不是青春期的开始
      description: 免费线上课 · 看到这些信号，代表倒计时已经开始
      intro: |-
        女儿来了初经、儿子开始变声长喉结 ——
        很多家长以为：孩子终于进入青春期了。

        错。

        那不是青春期的开始，那是青春期的中后期。
        意思是：孩子的成长倒计时，已经开始了。

        真正的青春期启动，比这些看得见的信号早得多。
        等你看到初经、看到喉结，
        能长的空间，其实已经不多了。

        所以预防性早熟，要比你想的更早开始：
        1️⃣ 少吃鸡皮和动物内脏
        2️⃣ 少吃速食和油炸食品
        3️⃣ 只吃当季水果
        4️⃣ 避免太早给孩子进补

        「那我的孩子已经进入青春期了，还有救吗？」

        好消息是：只要孩子还在 3～15 岁之间，就还有机会再长高。
        只是到了这个阶段，方法必须更准 —— 不能再一样一样乱试。
      closing: 倒计时已经开始了，但还没结束。
    cal:
      headline: 初經、變聲，不是青春期的開始
      description: 免費線上課 · 看到這些訊號，代表倒計時已經開始
      intro: |-
        女兒來了初經、兒子開始變聲長喉結 ——
        很多家長以為：孩子終於進入青春期了。

        錯。

        那不是青春期的開始，那是青春期的中後期。
        意思是：孩子的成長倒計時，已經開始了。

        真正的青春期啟動，比這些看得見的訊號早得多。
        等你看到初經、看到喉結，
        能長的空間，其實已經不多了。

        所以預防性早熟，要比你想的更早開始：
        1️⃣ 少吃雞皮和動物內臟
        2️⃣ 少吃速食和油炸食品
        3️⃣ 只吃當季水果
        4️⃣ 避免太早給孩子進補

        「那我的孩子已經進入青春期了，還有救嗎？」

        好訊息是：只要孩子還在 3～15 歲之間，就還有機會再長高。
        只是到了這個階段，方法必須更準 —— 不能再一樣一樣亂試。
      closing: 倒計時已經開始了，但還沒結束。
- id: review_best_of
