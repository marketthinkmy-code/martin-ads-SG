- id: height_stopped
  group: d_emotion
  kind: single_image
  dir: d_emotion/height_stopped
  content_id: sg-生长缓慢-孩子身高停止不长了
  copy:
    sg:
      headline: 孩子身高停止不长了？
      description: 一年长不到 6cm？免费线上课教你怎么救
      intro: |-
        你的孩子每年只长 1–2cm？
        明明已经很努力了，为什么还是比同龄人矮一截？

        其实，孩子长得慢的根本原因，
        往往是体质和营养吸收出了问题 ——
        不是多喝牛奶、多跳绳就能解决的。

        尤其如果你是这几种家长，请一定看下去：
        📌 孩子一年长不到 6cm
        📌 骨龄超前 / 落后
        📌 有性早熟迹象
        📌 注意力不集中
        📌 有睡眠障碍
        📌 课业压力大、长不高

        我已经帮助来自台湾、马来西亚、曼谷、澳洲、加拿大和美国的
        6000+ 名孩子，每年实现健康增高 6–8cm。
        这些孩子当中，有很多曾被认为「已经长不高了」，
        但在调整之后，他们依然长回来了。

        如果你也遇过这些情况：
        · 担心孩子遗传到父母的身高，再也长不高
        · 网上的偏方、保健品、运动都试过了，孩子还是没长
        · 看过中医也看过西医，调理了很久却不见效

