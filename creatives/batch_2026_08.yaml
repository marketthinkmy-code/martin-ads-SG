# Martin creative batch 2026-08 — one source of truth for every market.
#
# Copy used to live inline in scripts/build_sg_batch.py, which was fine for one market and would
# have become three diverging copies the moment MY and CAL wanted the same ads. Structure that
# every market shares (asset paths, grouping, card order, the mutual-exclusion layout) is stated
# once here; anything a market has to say differently lives under its own key.
#
# The four repeated blocks (bio / curriculum / negatives / cta) are per-market constants written
# ONCE instead of 18 times — that is most of what this file buys you.
#
# CAL is not just SG in Traditional characters:
#   · script hant, converted with OpenCC s2twp (Taiwan phrasing: 影片 not 视频, 麵包 not 面包)
#   · Southeast-Asian references replaced — 煲花生根 is a Malaysian/Singaporean remedy, so CAL
#     says 燉轉骨湯, which is the Taiwanese equivalent a Taiwanese-American parent recognises
#   · the 醫師 title is dropped: the official landing page says 國家考試高考合格藥師, and
#     California regulates physician/doctor titles. Flip `markets.cal.blocks.bio` if you disagree.
#   · link and geo are TODO — only you know CAL's landing page and which counties/cities to run.
#
# Regenerate SG copy from here; it round-trips byte-identically to what is live today.
