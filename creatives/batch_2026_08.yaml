      headline: 这 5 种运动，越做越矮
      description: 一堂免费线上课，教你比跳绳更有效的增高运动
      intro: |-
        孩子每天跳绳 500 下，可能越跳越矮 😫

        想长高，不一定要靠这 5 种运动 ——
        有些运动做过头，只会让孩子越做越矮：

        ❌ 每天跳绳 500 下
        ❌ 天天打篮球
        ❌ 大量力量训练
        ❌ 长时间跑步锻炼
        ❌ 高强度体操练习

        为什么？
        因为过度运动会让孩子筋膜紧绷、骨头之间打不开，
        反而挡住了长高的空间。

        合理的运动确实有助于长高，
        但「练得越多 = 长得越高」这个观念，是错的。
      closing: 免费名额有限，孩子的黄金成长期一生只有一次。
