name: adbot · Restore Revival budget + light up seller campaigns (manual)

# LIVE writes, operator-approved 24 Aug ("执行2-3"):
#   2. Winners Revival campaign budget back to RM100/day (was halved by hand to RM50).
#   3. Switch on the three campaigns holding the reopened sellers (Video 12 · Carousel
#      别再逼孩子喝牛奶了 · Single Image 女孩来了初经) — pausing every unproven sibling ad
#      BEFORE each campaign goes live, so only the proven sellers deliver.
#
# Verified by re-reading stored values; idempotent.

on:
  workflow_dispatch: {}

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Restore budget, enable sellers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/enable_seller_campaigns.py
