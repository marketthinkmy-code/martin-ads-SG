name: adbot · Execute window verdicts 0919 (manual)

# MUTATING, operator-ordered ("执行 全部照你说的做"): pause the Hook 9 chain (RM154
# window spend, zero leads), set Video 12 and Carousel 别再逼孩子喝牛奶 to RM60/day.
# Idempotent; audit in state/execute_window_0919_log.json.

on:
  workflow_dispatch: {}

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Close Hook 9, scale V12 + Carousel to RM60
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/execute_window_0919.py
      - name: Persist audit
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: persist 0919 window execution audit [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
