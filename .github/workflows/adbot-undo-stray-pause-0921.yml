name: adbot · Undo stray pause — 恢复 Hook 1/Hook 7 旧链 (manual)

# MUTATING, operator-ordered ("不要关"): reactivate the two RM40 F&R chains the 新片测试
# build paused, verify, and clear the strays_paused record.

on:
  workflow_dispatch: {}

jobs:
  undo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Restore the two chains
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/undo_stray_pause_0921.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: strays restored per 不要关 [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
