name: adbot · candidate check rule 3 + 4 (manual, read-only)

# READ-ONLY (26 Oct operator 「用过往有数据验证成交的广告去跑」): for the given ad names, MY / HK /
# SG old numbers, last-7-delivering-day registrations per SG ad, SG sales by UTM ad set. No writes.

on:
  workflow_dispatch:
    inputs:
      names:
        description: "'|'-separated ad names"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Check
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_NAMES: ${{ github.event.inputs.names }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/candidate_check_1026.py
