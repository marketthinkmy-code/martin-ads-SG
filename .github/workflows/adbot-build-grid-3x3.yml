name: adbot · Build Grid 3×3 Hook Test (manual)

# LIVE build, operator-approved 24 Aug ("建"). Creates 1 CBO campaign (RM150/day) + 3 ad sets
# (Parents 3–17 + Engaged · LAL 1-2% · Broad SG) + the SAME 3 hook ads in each (V5 倒數計時 ·
# Hook Edit 04 · Bread Hook 2) = 9 cells, everything PAUSED until reviewed.
#
# All three creatives are reused from state — zero uploads. advantage_audience is verified
# after creation on the Parents and LAL cells (Meta stored 1 on the LAL bands despite being
# sent 0) and rewritten if drifted. Per the operator's explicit call, V5's solo campaign keeps
# running alongside the grid.
#
# Idempotent: campaign/adset/ad ids persist to the branch; a re-dispatch reuses them.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (campaign/adset/ad ids)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build the 3×3 grid (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_grid_3x3.py
      - name: Persist created entity IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist grid 3x3 ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
