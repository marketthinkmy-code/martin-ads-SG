name: adbot · Delete QING 15岁+ leftovers (manual)

# MUTATING, operator-ordered (你先刪乾淨): remove the half-built QING 15岁+
# campaign/ad sets/ads/creatives (never spent). Build workflow removed in the
# same commit so nothing can recreate it without a new decision.

on:
  workflow_dispatch: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Delete leftovers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/delete_qing15_1005.py
      - name: Persist deletion record
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: QING 15岁+ leftovers deleted [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
