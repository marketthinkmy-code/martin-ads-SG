name: adbot · Pause dead high-CPL ads (manual)

# LIVE. Pauses only the ACTIVE copies of the two zero-SG-sale high-CPL losers
# (Extra Video 1 鼻子敏感 · MAY Video Hook 1 10个孩子会有8个), matched by distinctive core
# phrase. Flips just each ad's own switch — never its parent ad set/campaign. Idempotent.
# Writes nothing to the repo.

on:
  workflow_dispatch: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Pause dead high-CPL ads
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/pause_dead_high_cpl.py
