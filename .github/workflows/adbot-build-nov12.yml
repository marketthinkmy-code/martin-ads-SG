name: adbot · 11月新片7支 on F&R + H&W, start 12 Nov 00:00 (manual)

# MUTATING in mode=go, operator-ordered 11 Nov: two ABO campaigns on SG old (Family and Relationships, Health &
# Wellness), 7 ad sets each (one per video), RM50 each, start 2026-11-12 00:00 MYT, ads on the existing posts.
# mode=check (default) is a read-only preflight. Idempotent; 75 = rate limit.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only) / go (build)"
        required: false
        default: "check"
      audience:
        description: "FR / HW / ALL"
        required: false
        default: "ALL"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MODE: ${{ github.event.inputs.mode }}
          ADBOT_AUD: ${{ github.event.inputs.audience }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_nov12_aud_1111.py
      - name: Persist entity ids
        if: ${{ always() && github.event.inputs.mode == 'go' }}
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist nov12 F&R / H&W ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
