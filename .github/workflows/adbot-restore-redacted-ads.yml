name: adbot · Restore redacted Rina ads (manual)

# LIVE. Puts back the two creatives that were pulled for a leaked phone number, now that the
# number is painted out (scripts/redact_phone_numbers.py):
#   · re-creates F's 医生说不会再长 single-image ad
#   · restores card 4 of C's best-of carousel (4 cards -> 5, intended order)
# Both created PAUSED. Skips a step rather than duplicating if it is already in place.

on:
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Restore the redacted ads
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/restore_redacted_ads.py
