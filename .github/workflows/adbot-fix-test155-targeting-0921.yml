name: adbot · 新片测试 定向锁回 Adv+OFF 18-65 (manual)

# MUTATING, spec enforcement: Meta auto-flipped the test ad set to Advantage Audience ON /
# 25-65 minutes after creation; rewrite the cloned targeting with the explicit lock,
# verify, retry once, fail loudly if Meta refuses.

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Lock targeting
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/fix_test155_targeting_0921.py
