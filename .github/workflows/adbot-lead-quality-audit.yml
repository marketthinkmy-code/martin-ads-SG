name: adbot · Lead quality & budget allocation audit (read-only, manual)

# READ-ONLY. Joins the Paid Student List (who actually paid, by UTM ad name) to Meta ad-level
# spend and registrations, and reports three things:
#
#   1. lead quality  — lead→paid conversion per creative, to find ads buying cheap
#                      registrations that never buy
#   2. where the money went — last-30d spend ranked, each row carrying that creative's
#                      lifetime paid students and CPA
#   3. starved winners — creatives with a proven lifetime CPA inside target that are
#                      receiving almost no current budget
#
# Proven-ness is measured over LIFETIME and funding over 30 DAYS on purpose: "the ads that used
# to make money" is a lifetime claim while "didn't get enough budget" is a recent one, and
# judging both on the same window would hide exactly that case.
#
# Nothing is created, changed, paused or activated by this workflow.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Audit lead quality and budget allocation
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/lead_quality_audit.py
