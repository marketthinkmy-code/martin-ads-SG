name: adbot · Build 2× 1-1-5 winner stacks (Health & Wellness + Milk & Bread) (manual)

# Builds 2 CBO campaigns PAUSED (RM100/day each): the Top-5 SG winners (30-day) as 5 ads in
# each, on interest targeting cloned from the SG "Health & Wellness" and "Milk & Bread" ad sets.
# Reuses the winners' existing creatives (no re-upload). Idempotent. Operator activates after
# review. Reads/writes only the SG account + state/.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (campaign/adset/ad ids) back to the branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build 2x 1-1-5 winner stacks (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_1_1_5_winners.py
      - name: Persist created entity IDs back to the branch
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 2x 1-1-5 winner-stack entity ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
