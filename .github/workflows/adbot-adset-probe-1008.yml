name: adbot · ad set probe (manual, read-only)

# READ-ONLY, operator question (8 Oct): are the "empty" ad sets really empty / running /
# carrying sales history? Lists every ad in the given ad sets regardless of status, with
# spend and sheet sales. No writes.

on:
  workflow_dispatch:
    inputs:
      adset_ids:
        description: "comma-separated ad set ids to probe"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Probe
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_ADSET_IDS: ${{ github.event.inputs.adset_ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/adset_probe_1008.py
