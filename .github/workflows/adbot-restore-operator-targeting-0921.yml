name: adbot · 还原操作员手动定向 (manual)

# MUTATING, corrective: the operator had hand-set the 新片测试 ad set to Advantage
# Audience ON / 25-65; an automated "enforcement" pass overwrote it. Restore the
# operator's version and leave that ad set's targeting hands-off.

on:
  workflow_dispatch: {}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Restore Adv+ ON · 25-65
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/restore_operator_targeting_0921.py
