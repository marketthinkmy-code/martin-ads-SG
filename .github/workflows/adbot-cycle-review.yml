name: adbot · cycle review, webinar sales per ad (manual, read-only)

# READ-ONLY (29 Oct): every SG ad that spent in the cycle, judged on the webinar's sales

on:
  workflow_dispatch:
    inputs:
      cycle_from: {description: "cycle first day (Thursday)", default: "2026-10-29"}
      cycle_to: {description: "cycle last day (Tuesday)", default: "2026-11-03"}
      sales_from: {description: "webinar sales from (Wednesday)", default: "2026-11-04"}
      sheet_gid: {description: "optional: gid of the tab the operator linked, to confirm it is the paid list", default: ""}

jobs:
  since:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Since Thursday
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ADBOT_CYCLE_FROM: ${{ inputs.cycle_from }}
          ADBOT_CYCLE_TO: ${{ inputs.cycle_to }}
          ADBOT_SALES_FROM: ${{ inputs.sales_from }}
          ADBOT_SHEET_GID: ${{ inputs.sheet_gid }}
        run: python scripts/cycle_review_1105.py
