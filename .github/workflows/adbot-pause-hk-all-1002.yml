name: adbot · Pause ALL HK campaigns (manual)

# MUTATING, completes the operator's own shutdown (我都关完了 — the Ads Manager bulk
# edit stuck at "Publishing 2 of 15"; all 9 campaigns were still ACTIVE burning
# RM509/1 reg today). Campaign-level pause, ids recorded for undo. Idempotent.

on:
  workflow_dispatch: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Pause all
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/pause_hk_all_1002.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: persist HK full-pause record [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
