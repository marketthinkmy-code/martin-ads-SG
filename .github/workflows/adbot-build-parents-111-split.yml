name: adbot · Split Parents 兴趣定向 into 4×1-1-1 ABO (manual)

# LIVE restructure of campaign 120256891851180093 (Parents 兴趣定向 | 1-1-4, CBO RM100/day).
# CBO cannot be switched to ABO in place, so:
#
#   mode=build (default): creates FOUR new 1-1-1 pods — one campaign + one ad set + one ad per
#     video (Video 13 / 15 / 14 / 11), ABO with RM50/day on each ad set, targeting cloned from
#     the source's own Parents 3–17 + Engaged ad set, exact historical ad names + live creatives
#     reused. Everything PAUSED; the source campaign keeps running untouched.
#
#   mode=cutover: after review — activates all four pods, THEN pauses the source campaign.
#
# Idempotent: pod ids persist to state/entities_p111_*.json, so a re-dispatch never duplicates.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = create pods PAUSED · cutover = activate pods + pause old 1-1-4"
        type: choice
        options: [build, cutover]
        default: build

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # persist state/ (campaign/adset/ad ids per pod)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Split into 1-1-1 ABO pods
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MODE: ${{ inputs.mode }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_parents_1_1_1_split.py
      - name: Persist created entity IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist Parents 1-1-1 split ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
