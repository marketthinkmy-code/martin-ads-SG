name: adbot · Apply SG ads adjustments (manual)

# LIVE. Trim redundant winner copies · scale two cheap winners (≤RM200/day, skips any 'scale'
# campaign) · reopen deliver-safe cheap winners · activate the 1-1-1 Video 12. Scale-Winners
# budgets are never touched. Full audit in the log. Writes nothing to the repo.

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Apply adjustments
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/apply_ads_adjustments.py
