name: adbot · Export Cust Paid List for audit (manual, read-only)

# READ-ONLY. Creates NO Meta object and changes nothing in the ad account — it only reads the
# Paid Student List spreadsheet and writes an audit workbook into Google Drive for review.
#
# Option B is applied: the two Refund tabs and VIP upgrade (RM88) are excluded. Every surviving
# row is tagged with a country derived from its phone dialling code, and the workbook has a
# "SG only" tab and an "All markets" tab so the seed can be checked before any re-upload.
#
# Raw contact details go ONLY into that Drive workbook (shared with the operator). Nothing raw
# is logged, written to state/, or committed — this repo is public.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Google account to share the audit workbook with (blank = default)"
        required: false
        default: ""

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Export audit workbook
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AUDIT_EMAIL: ${{ github.event.inputs.email }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export_paid_list_audit.py
