name: adbot · reopen the 3pm-closed ads at 00:00 12 Nov (manual)

# MUTATING in mode=go, operator-ordered 11 Nov 21:4x: wait until 2026-11-12 00:00 +08:00, then switch the seven
# SG old ads the operator closed ~3 pm back on (ad / ad set / campaign). mode=check (default) is a read-only preview.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only preview) / go (wait for 00:00, then switch on)"
        required: false
        default: "check"

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reopen
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MODE: ${{ github.event.inputs.mode }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/reopen_1112.py
