name: adbot · Build Bread Hooks 1-1-2 (scheduled 20 Aug 00:00, manual)

# LIVE build. Creates 1 CBO campaign (RM100/day) + 1 ad set + 2 ads in the SG account and
# ACTIVATES them with start_time 2026-08-20T00:00:00+08:00.
#
# ACTIVE, not paused — a schedule that still needs a human to press play at midnight is not a
# schedule. Meta delivers nothing before that timestamp; the campaign begins on its own. It can
# be paused in Ads Manager at any point before then.
#
# Both videos are the same 麵包牛奶 body with a different spoken opening, so the ad copy is held
# constant and only the headline differs — the hook is the only variable being tested.
#
# The two Drive files are distinguished ONLY by an H1/H2 marker in their filenames, and the links
# were supplied in the opposite order to that marker. The script verifies each file's name before
# uploading and aborts rather than pair a hook with the wrong video.
#
# Idempotent: video ids, creative ids and entity ids persist to the branch, so a re-dispatch
# never re-uploads a 200MB file or duplicates the campaign.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # persist state/ (video/creative/campaign/adset/ad ids)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build the bread-hook 1-1-2 (scheduled)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_bread_hooks_1_1_2.py
      - name: Persist created entity IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist bread-hook 1-1-2 ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
