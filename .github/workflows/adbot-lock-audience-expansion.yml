name: adbot · Lock audience expansion off (LAL bands + retarget, manual)

# Edits targeting only — no campaign, ad set or ad is created, and nothing is activated.
#
# Both new test campaigns came back from the API with audience expansion ON despite being built
# with it off, by two different switches: the five 1-5-3 band ad sets had
# targeting_automation.advantage_audience stored as 1 (we sent 0), and the retargeting ad set kept
# advantage_audience 0 but gained targeting_relaxation_types.custom_audience = 1 plus a hidden 1%
# lookalike. Either one breaks the test it belongs to.
#
# The script re-reads every ad set after writing and reports the STORED value, because Meta
# already ignored this setting once and "we sent it" is not evidence it took.

on:
  workflow_dispatch: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Lock expansion off
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/lock_audience_expansion.py
