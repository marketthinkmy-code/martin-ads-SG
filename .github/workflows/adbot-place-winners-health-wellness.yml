name: adbot · Place winners into Health & Wellness (manual)

# LIVE writes approved 2026-07-30: add Video 8（1）⭐ + Hook 7 as NEW ACTIVE ads (reusing their
# existing creatives, no re-upload) into the live, currently-converting Health & Wellness ad set.
# Auto-locates the correct Health & Wellness (ACTIVE + most 60d spend). Idempotent. One-shot.

on:
  workflow_dispatch: {}

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Place winners into Health & Wellness
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/place_winners_health_wellness.py
