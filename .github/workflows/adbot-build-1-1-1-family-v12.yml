name: adbot · Build 1-1-1 on Family and Relationships (Video 12, manual)

# Builds ONE CBO campaign PAUSED (RM100/day) on interest targeting cloned from the SG
# "Interest: Family and Relationships" ad set: 1 campaign + 1 ad set + 1 ad (Video 12).
# Uploads Video 12 to Meta once (cached in state/entities_v12_shared.json). Idempotent.
# Operator activates after review. Reads/writes only the SG account + state/.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (video/creative/campaign/adset/ad ids) back to the branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build 1-1-1 Family and Relationships · Video 12 (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_1_1_1_family_v12.py
      - name: Persist created entity IDs back to the branch
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 1-1-1 Family and Relationships Video 12 entity ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
