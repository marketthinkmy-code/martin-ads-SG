name: adbot · CPL+CPA monitor (hourly)

# 11 Sep 每日广告规则 (SG): an ad that spends 1.5x the target CPL with 0 registrations is
# paused; a budget chain whose window CPL is above kpi.cpl_target_myr (RM95) gets its daily
# budget cut by 30% (once per MYT day, floored at RM50; ABO = ad set, CBO = campaign).
# Folded with the real-sales CPA gate (cpa.*): a healthy 60-day CPA rescues a pause, and a
# proven CPA hard stop (>RM1,200, matured) is paused. Whole-account, registration-optimized only.

on:
  schedule:
    # GitHub drops top-of-hour (":00") scheduled runs under load, so stagger to odd minutes
    # AND run a few times an hour for redundancy. The monitor is safe to repeat: it only
    # pauses over-threshold ACTIVE ads and never un-pauses, so extra runs are no-ops.
    - cron: "7,27,47 * * * *"   # ~every 20 min, off the congested hour boundary (UTC)
  workflow_dispatch:            # allow manual runs from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (evaluate + log what would pause, write nothing)"
        type: boolean
        default: false

concurrency:
  group: adbot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # push the best-effort audit ledger (repo default token is read-only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Run CPL+CPA monitor
        env:
          # pip install . is non-editable, so settings.py lands in site-packages and its
          # __file__-relative repo-root guess misses config/config.yaml. Point it at the checkout.
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m adbot monitor ${{ inputs.dry_run && '--dry-run' || '' }}
      # The REAL once-per-day guard is stateless on Meta (an ADBOT_BUDGET_CUT_<date> label
      # stamped on each cut entity) — this ledger push is best-effort audit only, and a
      # 403 here (org token policy) is harmless.
      - name: Persist budget-cut ledger (best-effort audit)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "monitor: persist daily budget-cut ledger [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
