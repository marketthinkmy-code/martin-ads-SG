name: adbot · creative pick, candidates with post ids (manual, read-only)

# READ-ONLY (20 Nov): per ad id — post id, lifetime / 60-day spend, registrations, CPL, own sales, CPA, rule-3 check.

on:
  workflow_dispatch:
    inputs:
      ad_ids:
        description: "comma-separated ad ids (SG old / HK)"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Pick
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_IDS: ${{ github.event.inputs.ad_ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/creative_pick_1120.py
