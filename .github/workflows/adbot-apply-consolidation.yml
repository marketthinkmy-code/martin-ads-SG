name: adbot · Apply SG consolidation (manual)

# LIVE writes approved 2026-07-27: fund Scale-Winners → RM250, pause Housewife /
# Food & Drink + Milk / Scale-CBO 2, and re-activate the Scale-Winners winner ads.
# Campaigns matched by name + ACTIVE status; skips ambiguous. One-shot dispatch.

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Apply SG consolidation
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/apply_consolidation.py
