name: adbot · 新片 5 支测试 1-1-5 F&R (manual)

# MUTATING, operator-ordered spec: one NEW campaign (ABO) · one ad set RM100/day named
# "Interest: Family and Relationships" (targeting cloned from the F&R winner, Adv+ OFF
# locked, buyer lists excluded, regional declaration as always) · five ads reusing the
# minted New Wave creatives (Hook 1 / Hook 4 保健品 / Hook 7 / Hook 3 倒掉牛奶 / Hook 6
# 没有人会告诉你), ACTIVE immediately; stray live copies of the five names get paused.
# 7-day hands-off is enforced by the cpl_hold entries committed with this build.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build the 1-1-5 test
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_test155_fr_0921.py
      - name: Persist entity ids
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 新片 5 支测试 ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
