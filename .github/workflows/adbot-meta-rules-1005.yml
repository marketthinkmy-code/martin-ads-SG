name: adbot · Meta automated rules, 0-lead kill (manual)

# MUTATING when dry_run=0 (operator: 我要继续监控，但不要开对话、不要烧 token):
# install Meta's own automated rules for the zero-lead kill on SG old / HK / MY,
# so enforcement runs on Meta's servers every 30 min with no GitHub and no Claude.
# dry_run=1 (default) only lists existing rules and prints the payloads.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = list + print only, 0 = create rules"
        required: true
        default: "1"

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Meta rules
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/meta_rules_1005.py
