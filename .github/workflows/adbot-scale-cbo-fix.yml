name: adbot · Reconcile Scale-CBO campaigns (manual)

# LIVE budget writes only. Restores 'Scale-CBO 2' to RM100 (undo an accidental raise) and, for the
# real Scale-CBO, reverts to RM200 if it holds any ACTIVE good ad (60d SG ROAS>=2 or 7d CPL<=65)
# else keeps the RM120 throttle. Prints every scale-cbo ad with 7d CPL + 60d SG ROAS. No repo writes.

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reconcile Scale-CBO
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/scale_cbo_fix.py
