name: adbot · 9 Sep approved reopens — Hook 9 + Hooks 0907 P/F&R (manual)

# LIVE. Operator approved the CPL-panic prescription in full ("都聽你的"): reopen Hook 9's
# sold chain (CPA RM402) and the Hooks 0907 Parents + F&R campaigns (eight pods killed at
# RM52-64 with no verdict, same hooks producing RM36-50 leads in Food). The other four
# misclosed names stay off. Scoped release checks on Hook 9's legacy campaign; the 0907
# campaigns contain only their approved pods. Audit appended to state/.

on:
  workflow_dispatch: {}

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # persist the action audit log under state/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Approved reopens
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/reopen_approved_0909.py
      - name: Persist action log back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: persist 9 Sep reopen log [skip ci]" || echo "no state change"
          git push || echo "push skipped"
