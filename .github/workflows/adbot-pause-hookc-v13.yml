name: adbot · Pause Hook Edits C + Video 13 in LAL bands (manual)

# LIVE writes, operator-approved 21 Aug:
#   1. Pause the Hook Edits C campaign (RM178 CPL — nearly 3x the RM65 ceiling).
#   2. Pause the Video 13 ad in each of the five LAL 1-5-3 band ad sets — the audit's
#      lead-quality problem: cheapest CPL in the account, one provably-SG sale ever.
#
# Each band keeps its other two ads and its budget; only the five Video 13 ads and the one
# campaign are touched. The script refuses to act if the campaign doesn't contain exactly
# five Video 13 ads in the five known band ad sets, and verifies every status by re-reading.

on:
  workflow_dispatch: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Apply the two approved cuts
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/pause_hookc_and_v13.py
