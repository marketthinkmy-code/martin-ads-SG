name: adbot · Reopen HK MILK (manual)

# MUTATING, operator-ordered ("hk 的 milk 今天有成绩，继续开着"): reactivate the MILK
# campaign from the HK full-pause record; the other 8 stay paused. Idempotent.

on:
  workflow_dispatch: {}

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reopen MILK
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/open_hkmilk_1002.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: HK MILK reopened [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
