name: adbot · 11 Sep verdicts — live-ad CPL vs Paid-Student-List CPA (manual, read-only)

# READ-ONLY. For each currently-live ad: CPL over the run window since the last Thursday
# reset, plus name-key SG sales / CPA from the Paid Student List, then the standing verdict
# rules (RM150-or-3-leads gate, RM65/RM100 lines, sales-rescue turns down instead of off).
# Nothing is switched — the output is a recommendation table for the operator.

on:
  workflow_dispatch: {}

jobs:
  verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Compute verdicts
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/verdicts_0911.py
