name: adbot · Build Cust Paid List audience + SG lookalikes (manual)

# LIVE. Rebuilds the "Cust Paid List" customer audience from the Paid Student List spreadsheet
# and creates SG-targeted lookalikes (1% and 3%) from it. The account's existing paid-list
# lookalikes were built 2026-03-22 and are five months stale.
#
# Customer emails and phones are normalised and SHA-256 hashed ON THE RUNNER before any network
# call — only digests reach Meta, and nothing raw is logged, written to state/, or committed.
#
# Creating audiences does not spend money and does not change any running ad set. Nothing starts
# targeting these until you add them to an ad set by hand.
#
# Re-dispatching is safe and is how you REFRESH the list: the seed audience id is cached in
# state/, an upload is an upsert, and lookalikes are only created when absent.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (seed + lookalike ids) back to the branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build seed audience + lookalikes
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_lookalike_paid_list.py
      - name: Persist audience IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist Cust Paid List audience + lookalike ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
