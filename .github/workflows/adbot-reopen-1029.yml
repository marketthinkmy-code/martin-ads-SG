name: adbot · reopen the 16 60-day SG sellers (manual)

# Operator 29 Oct 「A」「B」: reopen all 16 ads behind the 60-day SG sales. mode=check is read-only
# (statuses + other ads that would start running); mode=go sets ad -> ad set -> campaign ACTIVE.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only) or go"
        required: false
        default: "check"
      ad_ids:
        description: "comma-separated ad ids (default: the 29 Oct 16)"
        required: false

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reopen
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MODE: ${{ github.event.inputs.mode }}
          ADBOT_AD_IDS: ${{ github.event.inputs.ad_ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/reopen_1029.py
