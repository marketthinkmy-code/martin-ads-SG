name: adbot · 老片重开 3 · 5 ads on HK (manual)

# MUTATING, operator-ordered (20 Oct 「全建，RM50，今天开跑」): two ABO campaigns on the HK
# account (Health and Wellness 1-3-3 / Luxury 1-2-2), one ad set per video, RM50 each,
# ACTIVE now. Idempotent; 75 = rate limit.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_relaunch3_1020.py
      - name: Persist entity ids
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 老片重开 3 ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
