name: adbot · F&R 11月新片7支 pause 5 keep V8 V5 (manual)

on:
  workflow_dispatch:
    inputs:
      mode: {description: "check = preview, go = pause", default: "check"}

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Pause
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          ADBOT_MODE: ${{ inputs.mode }}
        run: python scripts/pause_fr5_1112.py
