name: adbot · Throttle bleeders + reopen 什麼樣的孩子 (manual)

# LIVE. Cut daily budget −40% (floor RM50) on the parent of each bleeder's heaviest live copy
# (孩子15岁以上 / 我不会买牛奶) — NOT paused. Shields Scale-Winners, 1-1-5 stacks, and any pool
# holding a scaled winner (reports + recommends pause there instead). Reopens 什麼樣的孩子 where
# its parent ad set is ACTIVE. Full audit; writes nothing to the repo.

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Throttle + reopen
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/throttle_and_reopen.py
