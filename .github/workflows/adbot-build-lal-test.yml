name: adbot · Build LAL 1-5% test campaign (1-1-3, manual)

# LIVE build. Creates 1 CBO campaign (RM100/day) + 1 ad set + 3 ads in the SG account, all
# PAUSED — nothing spends until you activate in Ads Manager.
#
# The ad set targets Lookalike (SG, 1% to 5%) - Cust Paid List (SG) with Advantage+ audience
# OFF, so the lookalike is what actually gets tested rather than a starting hint Meta expands
# past. The three ads reuse the account's highest-lifetime-conversion creatives by id, so each
# points at the same page post as the original and engagement pools rather than splits.
#
# The lookalike needs a few hours to finish sizing before it can deliver at all.
#
# Idempotent: entity ids are persisted back to the branch, so a re-dispatch reuses them.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (campaign/adset/ad ids) back to the branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build the LAL test campaign (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_lal_test_campaign.py
      - name: Persist created entity IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist LAL 1-5% test entity ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
