name: adbot · Apply week reopen/close verdicts (manual)

# LIVE writes, operator-approved 22 Aug ("执行"), from the week reopen/close audit:
#   REOPEN 5 wrongly-killed sellers (provably-SG sales at CPA inside the acceptable line):
#     牛奶+面包 (Winners Revival) · DEC HOOK 13 (H&W) · Video 12 試了五六種 (Interest: Family)
#     · Carousel 别再逼孩子喝牛奶了 (迷思打破 B) · Single Image 女孩来了初经 (单图-迷思)
#   CLOSE 2 proven losers still running (CPA above the RM1,300 hard stop, well funded):
#     MAR Video 8（1） in H&W · MAR Video 1 我不会买牛奶 in all five LAL 1-5-3 bands.
#
# All-or-nothing: every target is resolved and count-checked BEFORE anything is written; one
# unexpected match anywhere aborts the whole run untouched. Every write is verified by re-read.

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reopen the sellers, close the losers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/apply_week_reopen_close.py
