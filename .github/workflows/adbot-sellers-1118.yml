name: adbot · 60-day sellers list + reopen chain (manual)

# check (read-only): list SG老户 + HK ads with an own sale in the last 60 days and their chain status.
# go (LIVE, operator 18 Nov): for ad_ids, pause other ad-level-ACTIVE ads in the same campaigns,
# set ad + ad set + campaign ACTIVE, read every ad back.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only) or go"
        default: "check"
      ad_ids:
        description: "go only: comma-separated ad ids"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Sellers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_MODE: ${{ github.event.inputs.mode }}
          ADBOT_AD_IDS: ${{ github.event.inputs.ad_ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/reopen_sellers_1118.py
