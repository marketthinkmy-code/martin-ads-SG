name: adbot · reopen 3 SG campaigns at Thu 19 Nov 00:00 SGT (one-off)

# Operator 18 Nov 2026: 「等下 00:00 开完我今天 3:00pm 左右关的广告」.
# The operator paused these 3 SG老户 campaigns at 15:32 SGT on 18 Nov (webinar day); inside them
# only these 3 ads are still status ACTIVE, so reopening the campaigns resumes exactly:
#   120259458979710093 F&D 11月新片7支  › Video 5：饭桌生活细节场景 120259459004440093
#   120259499592070093 H&W 11月新片7支  › Video 5：饭桌生活细节场景 120259499603470093
#   120259531545720093 11月新片B        › Video 10：不是吃不够，是吸收不到 120259531550250093
# Cron is UTC: 16:01 UTC 18 Nov == 00:01 SGT 19 Nov; one backup at 00:31 SGT.
# Guard: only acts between 2026-11-18T16:00Z and 2026-11-18T18:00Z (00:00–02:00 SGT), so a late
# GitHub cron run can never reopen these after the operator changes them in the morning.
# activate_ids is idempotent (already ACTIVE = no-op). Delete this file after 19 Nov.

on:
  schedule:
    - cron: "1 16 18 11 *"
    - cron: "31 16 18 11 *"
  workflow_dispatch: {}

concurrency:
  group: adbot-reopen-1119
  cancel-in-progress: false

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Time window guard (00:00–02:00 SGT on 19 Nov only)
        id: guard
        run: |
          now=$(date -u +%s)
          start=$(date -u -d '2026-11-18T16:00:00Z' +%s)
          end=$(date -u -d '2026-11-18T18:00:00Z' +%s)
          if [ "$now" -ge "$start" ] && [ "$now" -lt "$end" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"; echo "inside window, reopening"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"; echo "outside 00:00–02:00 SGT 19 Nov window ($(date -u)); doing nothing"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == '1'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == '1'
        with:
          python-version: "3.11"
      - run: pip install .
        if: steps.guard.outputs.ok == '1'
      - name: Activate the 3 campaigns
        if: steps.guard.outputs.ok == '1'
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_ACTIVATE_IDS: "120259458979710093,120259499592070093,120259531545720093"
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/activate_ids.py
