name: adbot · Reopen the sold chains only (manual)

# LIVE. Operator, after the 誤關 audit: "就只開有成交的 campaign - ad set - ad 就好".
# Each provably-SG sale from the last 14 days on the three misclosed names is resolved via
# its OWN UTM values to the matching campaign ▸ ad set ▸ ad, and exactly that chain is
# switched on. Before a campaign wakes, every other ad-level-ACTIVE ad in it is ad-level
# paused (no sibling can deliver). Budgets untouched. Unmatchable sales are skipped, not
# guessed. Actions are appended to state/reopen_sold_chains_log.json.

on:
  workflow_dispatch: {}

jobs:
  reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # persist the action audit log under state/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Reopen sold chains
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/reopen_sold_chains.py
      - name: Persist action log back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "ops: persist reopen-sold-chains log [skip ci]" || echo "no state change"
          git push || echo "push skipped"
