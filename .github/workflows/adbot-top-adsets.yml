name: adbot · Top-converting ad sets (manual, read-only)

# READ-ONLY. Ranks UTM Ads Set values on the Paid Student List by provably-SG sales,
# folds each name's lifetime spend for CPA, and prints the top names' real Meta targeting
# digests — the operator picks the new build's 3 ad sets from this.

on:
  workflow_dispatch: {}

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Rank ad sets by conversions
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/top_adsets_analysis.py
