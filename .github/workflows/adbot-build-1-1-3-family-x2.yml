name: adbot · Build 2× 1-1-3 on Family and Relationships (manual)

# Builds 2 CBO campaigns PAUSED (RM100/day each) on interest targeting cloned from the SG
# "Interest: Family and Relationships" ad set. Campaign A = Video 16/7/15, B = Video 14/11/13,
# reusing the 6 videos' existing creatives (no re-upload). Idempotent. Operator activates after
# review. Reads/writes only the SG account + state/.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # persist state/ (campaign/adset/ad ids) back to the branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build 2x 1-1-3 on Family and Relationships (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_1_1_3_family_x2.py
      - name: Persist created entity IDs back to the branch
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 2x 1-1-3 Family and Relationships entity ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
