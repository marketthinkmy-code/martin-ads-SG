name: adbot · Total daily budget (manual, read-only)

# READ-ONLY. Sums the daily budgets of chains that can actually deliver right now
# (ABO ad-set budgets with >=1 live ad; CBO campaign budgets once each) and prints the
# per-campaign breakdown + account total. Answers the operator's "给我目前 total daily ad spend".

on:
  workflow_dispatch: {}

jobs:
  total:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Sum deliverable daily budgets
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/total_daily_budget.py
