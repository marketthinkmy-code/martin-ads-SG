name: adbot · Port board to NEW ad account (manual)

# MUTATING, operator-ordered A/B test: rebuild the approved 0925 board on the NEW ad
# account act_1179668409969241 (same names, pixel, landing page, url_tags) — videos and
# creatives re-uploaded from the old account's CDN sources, targeting cloned with
# custom-audience components stripped, campaigns created PAUSED. Hard preflight: account
# access, ACTIVE status, MYR currency; funding + pixel visibility warned.
# Idempotent via state/entities_newacct_0925.json; rate limit exits 75, re-dispatch resumes.

on:
  workflow_dispatch: {}

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Port the board
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_newacct_0925.py
      - name: Persist entity ids
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist new-account port ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
