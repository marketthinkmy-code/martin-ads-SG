name: adbot · why today (manual, read-only)

# READ-ONLY (25 Oct operator 「为什么今天那么贵」): given ads day by day (CPM, CTR, landing
# page views, registration rate) plus today's and the past week's hourly registrations. No writes.

on:
  workflow_dispatch:
    inputs:
      ad_ids:
        description: "comma-separated HK ad ids"
        required: false
      since:
        description: "start date YYYY-MM-DD"
        required: false

jobs:
  why:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Why today
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_AD_IDS: ${{ github.event.inputs.ad_ids }}
          ADBOT_SINCE: ${{ github.event.inputs.since }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/why_today_1025.py
