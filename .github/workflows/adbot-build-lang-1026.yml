name: adbot · 中英文 · 6 ads on HK (manual)

# MUTATING, operator-ordered (26 Oct 「A」, campaign 名不需要老片重开): two ABO campaigns on the HK
# account (Food and Drink + Milk 1-3-3 / Family and Relationships 1-3-3), English + Chinese, RM50 each,
# ACTIVE now. Idempotent; 75 = rate limit.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_lang_1026.py
      - name: Persist entity ids
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 中英文 ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
