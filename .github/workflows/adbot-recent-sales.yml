name: adbot · Recent sales check (read-only, manual)

# READ-ONLY. Reports the Paid Student List's latest rows: every sale from the last 10 days
# (date / SG marker / campaign / ad / amount), the August-vs-July monthly pace, and whether any
# recent sale traces by campaign UTM to the campaigns launched in the last two weeks
# (Winners Revival, LAL 1-5%, Bread Hooks, Hook Edits, Retarget). Nothing is changed.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Read the latest sales
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/recent_sales_check.py
