name: adbot · Build 30d VV50 retargeting ad (1-1-1, manual)

# LIVE build. Creates 1 CBO campaign (RM50/day) + 1 ad set + 1 ad in the SG account, PAUSED —
# nothing spends until you activate in Ads Manager.
#
# The ad set targets "30days video view" (120238646457220093): 30-day retention,
# video_view_50_percent, MARTIN page — roughly 5,000-5,800 people. Advantage+ audience is OFF so
# the budget stays on that warm pool instead of expanding to strangers who resemble them.
#
# The KL reel is uploaded fresh from Drive (221MB). Reusing the published Reel post was tried and
# rejected by Meta with "not available ... you might not have permissions to see it", so the ad
# starts without the reel's organic likes and comments. Boost the reel by hand in Ads Manager if
# that social proof matters.
#
# Idempotent: video id, creative id and entity ids persist to the branch, so a re-dispatch never
# re-uploads the video or duplicates the campaign.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # persist state/ (video/creative/campaign/adset/ad ids)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build the retargeting ad (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_retarget_vv50.py
      - name: Persist created entity IDs back to the branch
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist 30d VV50 retargeting ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
