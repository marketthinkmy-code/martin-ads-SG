name: adbot · SG top sellers (manual, read-only)

# READ-ONLY (26 Oct operator 「60 天有出单最多的广告是什么」): SG sales by ad for the window,
# with UTM ad set + date per sale, Meta spend/registrations, last-7-day spend, MY same window.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "window in days (default 60)"
        required: false

jobs:
  top:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Top sellers
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_DAYS: ${{ github.event.inputs.days }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sg_top60_1026.py
