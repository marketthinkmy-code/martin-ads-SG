name: adbot · SG lead quality audit, Register tab (manual, read-only)

# READ-ONLY (6 Nov): SG lead quality audit — Register tab survey scores by verified SG campaign / ad set / ad. No writes.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "registration date from YYYY-MM-DD (default: first survey date)"
        required: false
      date_to:
        description: "registration date to YYYY-MM-DD (default: today)"
        required: false
      survey_launch:
        description: "survey launch date YYYY-MM-DD confirmed by operator (default: inferred)"
        required: false

jobs:
  since:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Since Thursday
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_FROM: ${{ github.event.inputs.date_from }}
          ADBOT_TO: ${{ github.event.inputs.date_to }}
          ADBOT_SURVEY_LAUNCH: ${{ github.event.inputs.survey_launch }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/lead_quality_1106.py
