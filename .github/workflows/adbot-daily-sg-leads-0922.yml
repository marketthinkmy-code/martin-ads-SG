name: adbot · SG daily leads breakdown (manual, read-only)

# READ-ONLY: Meta per-day spend + conversion leads for the SG account and per-ad daily
# lead attribution, to diagnose the sheet's flat 4/4/4/4 register column.

on:
  workflow_dispatch: {}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Daily breakdown
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/daily_sg_leads_0922.py
