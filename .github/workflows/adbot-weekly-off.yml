name: adbot · weekly OFF (Wed 15:00 MYT)

# Pauses every active ad in the account (whole-account: MTC + STOCKBLOOM) and labels them,
# so weekly-on can resume exactly this set.
# Cron is UTC: Wed 07:00 UTC == Wed 15:00 Asia/Kuala_Lumpur (GMT+8).

on:
  schedule:
    - cron: "9 7 * * 3"        # Wed 15:09 MYT (off the congested ":00" slot)
    - cron: "9 8 * * 3"        # Wed 16:09 MYT — backup if the first was dropped (re-pause is a no-op)
  workflow_dispatch: {}

concurrency:
  group: adbot-weekly
  cancel-in-progress: false

jobs:
  weekly-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      # 9 Sep operator call ("明天才直播 今天不要关"): webinar week — the Wed 10 Sep 2026
      # pause is skipped so ads run straight into the webinar. Self-expiring: after that
      # date this guard never matches again and the weekly rhythm continues untouched.
      - name: Webinar-week skip check (self-expiring)
        id: skipcheck
        run: |
          today=$(TZ=Asia/Kuala_Lumpur date +%F)
          if [ "$today" = "2026-09-10" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping weekly OFF for the 10 Sep webinar window"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pause all managed ads (weekly OFF)
        if: steps.skipcheck.outputs.skip != 'true'
        env:
          # pip install . is non-editable, so settings.py lands in site-packages and its
          # __file__-relative repo-root guess misses config/config.yaml. Point it at the checkout.
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python -m adbot weekly_off
