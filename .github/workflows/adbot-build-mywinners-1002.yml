name: adbot · MY WINNERS 1-2-2 on SG (manual)

# MUTATING, operator-ordered ("有成绩的记得帮我开好在 sg，我验收"): the two MY sweep
# keepers not already in the SG-back board (一个3~15岁 / 马六甲), one campaign CBO
# RM80/day PAUSED, FAMILY-template targeting, page-post reuse. Idempotent; 75 = rate limit.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build MY WINNERS (PAUSED)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_mywinners_1002.py
      - name: Persist entity ids
        if: always()
        run: |
          git config user.name "adbot"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build: persist MY WINNERS ids [skip ci]" || echo "no state change"
          git pull --rebase origin main || true
          git push || echo "push skipped"
