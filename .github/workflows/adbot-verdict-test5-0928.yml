name: adbot · 新片5支 7天判决 (0928, read-only)

# READ-ONLY: fold the 9/21 old-account test and its 9/25 new-account copy by ad name,
# per-ad spend/clicks/CPC/leads/CPL since 9/21 plus SG sales attribution from the sheet,
# verdict per the operator's 30d-CPA discipline. Nothing changes without approval.

on:
  workflow_dispatch: {}

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Verdict
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/verdict_test5_0928.py
