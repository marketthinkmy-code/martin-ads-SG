name: adbot · read ids (manual, read-only)

# READ-ONLY: dump campaigns / ad sets / ads by id with the account currency, for 对账.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma-separated campaign / ad set / ad ids"
        required: true

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Read
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          ADBOT_READ_IDS: ${{ github.event.inputs.ids }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/read_ids.py
